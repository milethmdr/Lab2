<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas por Prioridad</title>
    <link rel="stylesheet" href="./src/styles/styles.css">
</head>
<body>
    <h1>Gestor de Tareas por Prioridad</h1>

    <section>
        <input
            type="text"
            id="titulo"
            placeholder="Ingrese una tarea">

        <select id="prioridad">
            <option value="Alta">Alta</option>
            <option value="Media">Media</option>
            <option value="Baja">Baja</option>
        </select>
        <button id="btn-agregar">Agregar</button>
    </section>
    <hr>

    <!-- Ordenamiento -->
    <section class="controles">
        <button id="orden-prioridad">Ordenar por Prioridad</button>
        <button id="orden-fecha">Ordenar por Fecha</button>

    </section>

    <!-- Filtros -->
    <section class="controles">
        <select id="filtro-prioridad">
            <option value="todas">Todas las prioridades</option>
            <option value="Alta">Alta</option>
            <option value="Media">Media</option>
            <option value="Baja">Baja</option>
        </select>
        <select id="filtro-estado">
            <option value="todos">Todos los estados</option>
            <option value="pendientes">Pendientes</option>
            <option value="completadas">Completadas</option>
        </select>

    </section>
    <hr>

    <ul id="lista-tareas"></ul>
</body>

</html>
